
<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Translate App — Текст</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animation.css">
    <script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
}
</script>
</head>

<body>
    <main class="phone-screen screen-2">

        <section class="text-editor">

            <label for="textInput">
                Текст за превод
            </label>

            <textarea
                id="textInput"
                name="text"
                rows="5"
                placeholder="Въведете текст тук..."></textarea>

            <div class="text-controls">

                <button
                    type="button"
                    id="dictationButton">
                    🎙 Диктовка
                </button>

                <button
                    type="button"
                    id="speakButton">
                    🔊 Прочети текста
                </button>

                <button
                    type="button"
                    id="clearTextButton">
                    Изчисти
                </button>

            </div>

            <p
                id="textStatus"
                role="status"
                aria-live="polite">
                Въведете текст, за да започнете.
            </p>

        </section>

        <nav class="floating-nav" aria-label="Навигация">

            <button
                type="button"
                onclick="window.location.href='index.html'"
                aria-label="Главно меню">

                <img src="assets/images/blackbar.png" alt="">

            </button>

            <button
                type="button"
                onclick="window.location.href='kamera.html'"
                aria-label="Към камерата">

                <img src="assets/images/blackarrow.png" alt="">

            </button>

        </nav>

        <!-- 3D AVATAR VIEWPORT -->

        <section class="screen-gray-bg avatar-stage">

            <div
                id="avatarContainer"
                class="avatar-container"
                aria-label="3D аватар за изпълнение на жестове">

                <!-- Three.js ще създаде 3D сцената тук -->

                <p
                    id="avatarStatus"
                    role="status"
                    aria-live="polite">
                    Подготвяне на 3D аватара...
                </p>

            </div>

        </section>

    </main>

    <!-- Управление на текст -->

    <script src="js/spelling.js" defer></script>

    <!-- Универсална 3D система за жестове -->

    <script type="module" src="js/avatar.js"></script>

</body>
</html>
