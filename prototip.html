<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прототип на приложение - Версия 2</title>
    <!-- Добавяме библиотека за икони -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Основни настройки */
        body {
            margin: 0;
            padding: 40px;
            background-color: #e8e8e8;
            font-family: Arial, sans-serif; /* Използваме стандартен шрифт, подобен на този от снимките */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phones-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Контейнер за телефон */
        .phone-screen {
            width: 320px;
            height: 680px;
            background-color: #fff;
            border-radius: 40px;
            border: 12px solid #333;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            position: relative;
        }

        /* --- СТИЛОВЕ ЗА ЕКРАН 1 (Камера) --- */
        .header-black {
            background-color: #000;
            color: #fff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
        }
        
        .header-black .menu-text {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .header-black .icons {
            display: flex;
            gap: 15px;
            font-size: 20px;
        }

      .screen-gray-bg {
            background-color: #d0d6dc; /* Светло сиво */
            flex: 6; /* Задава 60% от височината на екрана */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end; /* Притиска човечето към долния край */
            padding: 20px;
            padding-bottom: 40px;
        }

        .footer-black {
            background-color: #000;
            color: #fff;
            text-align: center;
            padding: 15px;
            font-size: 12px;
        }

        /* --- ГРАФИКА НА ЧОВЕЧЕТО (Използва се в Екран 1 и 2) --- */
        .person-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .head {
            width: 80px;
            height: 80px;
            background-color: #ff8c33; /* Оранжево */
            border-radius: 50%;
            margin-bottom: 10px;
        }

        .body {
            width: 140px;
            height: 200px;
            background-color: #0033cc; /* Тъмно синьо */
            border-radius: 15px;
            border: 2px solid #a0b0ff; /* Светъл кант */
        }

        .text-bold {
            font-size: 22px;
            font-weight: 900;
            text-align: center;
            color: #000;
            line-height: 1.2;
            margin-top: 20px;
        }

        /* --- СТИЛОВЕ ЗА ЕКРАН 2 (Преводач) --- */
       .top-white-text {
            background-color: #fff;
            flex: 4; /* Задава 40% от височината на екрана */
            display: flex;
            align-items: center; /* Центрира текста вертикално */
            justify-content: center; /* Центрира текста хоризонтално */
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: 900;
            color: #111;
            line-height: 1.3;
        }

        /* Плаващо меню */
      .floating-nav {
            position: absolute;
            top: 40%; /* Слагаме го точно там, където свършва бялото */
            left: 50%;
            transform: translate(-50%, -50%); /* Центрираме го точно на линията */
            width: 85%;
            background-color: #fff;
            border-radius: 30px;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .floating-nav .menu-text {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #333;
        }

        .floating-nav i.fa-recycle {
            font-size: 22px;
            color: #000;
        }

        /* Намаляваме човечето във втория екран, за да се събере */
        .screen-2 .head { width: 60px; height: 60px; }
        .screen-2 .body { width: 100px; height: 150px; }
        .screen-2 .person-container { margin-top: 40px; }

        /* --- СТИЛОВЕ ЗА ЕКРАН 3 (Меню) --- */
        .menu-screen {
            background-color: #fff;
            flex: 1;
            padding: 60px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .main-buttons {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .btn-large {
            background-color: #c6d2dc;
            border: none;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 24px;
            font-weight: 900;
            color: #000;
            cursor: pointer;
        }

        .btn-large i {
            font-size: 35px;
        }

        .bottom-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .btn-small {
            background-color: #c6d2dc;
            border: none;
            border-radius: 15px;
            padding: 12px 20px;
            width: 70%;
            font-size: 16px;
            font-weight: 900;
            color: #000;
            text-align: center;
            line-height: 1.2;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <div class="phones-container">
        
        <!-- ЕКРАН 1: Камера гледа човека -->
        <div class="phone-screen">
            <div class="header-black">
                <div class="menu-text">
                    <i class="fas fa-bars"></i> menu
                </div>
                <div class="icons">
                    <i class="fas fa-recycle"></i>
                    <i class="fas fa-sync-alt"></i>
                </div>
            </div>
            <div class="screen-gray-bg">
                <div class="person-container">
                    <div class="head"></div>
                    <div class="body"></div>
                </div>
                <div class="text-bold">
                    kamerata koqto<br>gleda choveka
                </div>
            </div>
            <div class="footer-black">
                prazno mqsto
            </div>
        </div>

        <!-- ЕКРАН 2: Редакция на текст -->
        <div class="phone-screen screen-2">
            <div class="top-white-text">
                teksta kojto sche<br>izleze sled prevoda<br>ot kamera. mozhe<br>da se redaktira,<br>ponezhe kamera<br>mozhe da sbyrka
            </div>
            
            <!-- Плаващото меню -->
            <div class="floating-nav">
                <div class="menu-text">
                    <i class="fas fa-bars"></i> menu
                </div>
                <i class="fas fa-recycle"></i>
            </div>

            <div class="screen-gray-bg" style="justify-content: flex-end; padding-bottom: 40px;">
                <div class="person-container">
                    <div class="head"></div>
                    <div class="body"></div>
                </div>
                <div class="text-bold" style="margin-top: 0;">
                    animirano choveche
                </div>
            </div>
        </div>

        <!-- ЕКРАН 3: Главно меню -->
        <div class="phone-screen">
            <div class="menu-screen">
                <div class="main-buttons">
                    <button class="btn-large">
                        Превод <i class="fas fa-camera"></i>
                    </button>
                    <button class="btn-large">
                        Речник <i class="fas fa-book-open"></i>
                    </button>
                </div>
                
                <div class="bottom-buttons">
                    <button class="btn-small">
                        идеи за<br>надграждане
                    </button>
                    <button class="btn-small">
                        докладвай за<br>грешки
                    </button>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
