<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Translate App — Камера</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animation.css">

    <script src="js/recorder.js" defer></script>
</head>

<body>
    <main class="phone-screen">

        <header class="header-black">
            <div class="menu-text">
                <button
                    type="button"
                    onclick="window.location.href='index.html'"
                    aria-label="Главно меню">
                    <img src="assets/images/whitebar.png" alt="">
                </button>
            </div>

            <nav class="icons" aria-label="Навигация">
                <button
                    type="button"
                    onclick="window.location.href='dataset.html'"
                    aria-label="Записи">
                    <img src="assets/images/whitearrowC.png" alt="">
                </button>

                <button
                    type="button"
                    onclick="window.location.href='tekst.html'"
                    aria-label="Към текстовия екран">
                    <img src="assets/images/whitearrow.png" alt="">
                </button>
            </nav>
        </header>

        <section class="screen-gray-bg camera-stage">

            <h1 class="text-bold">Камера</h1>

            <div class="camera-preview">
                <video
                    id="videoPreview"
                    autoplay
                    muted
                    playsinline
                    aria-label="Преглед от камерата">
                </video>

                <p id="cameraPlaceholder">
                    Камерата ще показва човека тук.
                </p>
            </div>

            <div class="camera-controls">
                <button
                    type="button"
                    id="cameraStartButton">
                    Включи камерата
                </button>

                <button
                    type="button"
                    id="cameraStopButton"
                    disabled>
                    Изключи камерата
                </button>
            </div>

            <div class="recording-controls">
                <button
                    type="button"
                    id="recordStartButton"
                    disabled>
                    Започни запис
                </button>

                <button
                    type="button"
                    id="recordStopButton"
                    disabled>
                    Спри записа
                </button>
            </div>

            <p
                id="recordingStatus"
                role="status"
                aria-live="polite">
                Камерата не е включена.
            </p>

        </section>

        <section class="camera-metadata">

            <h2>Информация за записа</h2>

            <label for="participantId">
                Идентификатор на участника
            </label>

            <input
                type="text"
                id="participantId"
                name="participant_id"
                autocomplete="off"
                placeholder="Например: P001">

            <label for="signLabel">
                Жест / етикет
            </label>

            <input
                type="text"
                id="signLabel"
                name="label"
                placeholder="Например: А">

            <label class="consent-label">
                <input
                    type="checkbox"
                    id="consentCheckbox"
                    name="consent_given">

                Съгласен/на съм видеозаписът да бъде използван
                за целите на проекта.
            </label>

        </section>

        <footer class="footer-black">
            <a href="dataset.html">Управление на записите</a>
        </footer>

    </main>
</body>
</html>
